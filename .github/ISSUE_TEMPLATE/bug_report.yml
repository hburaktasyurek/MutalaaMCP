name: Hata bildirimi / Bug report
description: Hassas olmayan, yeniden üretilebilir bir hata bildirin / Report a non-sensitive, reproducible defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        ## Güvenlik ve gizlilik / Security and privacy
        Erişim belirteci, yenileme belirteci, API anahtarı, sunucu sırrı, kişisel veri, hukuki sorgu veya belge metni eklemeyin. Günlükleri ve örnekleri ayıklayın.

        Do not include access or refresh tokens, API keys, server secrets, personal data, legal queries, or document text. Redact logs and examples.

        Güvenlik açığını burada bildirmeyin; GitHub Private Vulnerability Reporting kanalını kullanın. Hukuki tavsiye istekleri bu issue formunun kapsamı dışındadır.

        Do not report a security vulnerability here; use GitHub Private Vulnerability Reporting. Legal-advice requests are outside this issue form's scope.
  - type: input
    id: version
    attributes:
      label: Sürüm veya kaynak revizyonu / Version or source revision
      description: Paket sürümünü veya test ettiğiniz commit'i yazın. / State the package version or commit you tested.
      placeholder: "0.1.0 veya / or abc1234"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Yeniden üretim adımları / Steps to reproduce
      description: Hassas içeriği ayıklayarak, en küçük adımları ve komutları yazın. / Provide the smallest steps and commands, with sensitive content redacted.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: observed-outcome
    attributes:
      label: Gözlenen sonuç / Observed outcome
      description: Aldığınız sonucu veya hatayı paylaşın; günlüklerdeki hassas değerleri ayıklayın. / Share the result or error, redacting sensitive values from logs.
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: Beklenen sonuç / Expected outcome
      description: Bunun yerine ne olmasını beklediğinizi açıklayın. / Explain what you expected instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ortam / Environment
      description: İşletim sistemi, Python sürümü, kurulum yöntemi ve ilgili istemci/sürümü yazın; yerel yolları veya hesap bilgilerini ayıklayın. / State OS, Python version, installation method, and relevant client/version; redact local paths and account details.
      placeholder: |
        - OS:
        - Python:
        - Installation:
        - Client and version (if relevant):
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik onayı / Privacy confirmation
      options:
        - label: Hassas içerik eklemediğimi ve bunun hukuki tavsiye isteği olmadığını onaylıyorum. / I confirm I have not included sensitive content and this is not a legal-advice request.
          required: true
